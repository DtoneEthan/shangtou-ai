  <style>
/* ============================================================
   BOBO.AI — Kimi 风格极简黑白主题
   ============================================================ */

:root {
  --bg-primary: #ffffff;
  --bg-sidebar: #f7f7f7;
  --bg-soft: #f5f5f5;
  --text-primary: #1a1a1a;
  --text-secondary: #666666;
  --text-muted: #999999;
  --border-color: #ececec;
  --accent: #1a1a1a;
  --accent-online: #16a34a;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
  --shadow-pop: 0 4px 16px rgba(0,0,0,0.10);
  --sidebar-w: 248px;
  --content-max: 760px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

#root { height: 100%; }

button { font-family: inherit; cursor: pointer; }

.app-container { display: flex; height: 100vh; overflow: hidden; }

/* ===================== 侧边栏 ===================== */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 40;
}
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  height: 100%;
}
.sidebar-header {
  padding: 18px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.sidebar-logo { display: flex; align-items: center; gap: 10px; }
.brand-avatar {
  width: 30px; height: 30px;
  border-radius: 8px;
  object-fit: cover;
  flex: 0 0 auto;
}
.brand-wrap { display: flex; flex-direction: column; line-height: 1.2; }
.brand-name { font-weight: 700; font-size: 15px; color: var(--text-primary); }
.brand-author { font-size: 11px; color: var(--text-muted); }

.new-chat-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  padding: 10px 12px;
  background: #ffffff;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 14px; font-weight: 500;
  transition: background .15s, border-color .15s;
}
.new-chat-btn:hover { background: #fff; border-color: #d8d8d8; box-shadow: var(--shadow-pop); }
.new-chat-btn kbd {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-soft);
  border: 1px solid var(--border-color);
  border-radius: 5px;
  padding: 1px 6px;
  font-family: inherit;
}

.sidebar-history {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 8px 10px;
}
.history-item {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13.5px;
  cursor: pointer;
  transition: background .12s;
}
.history-item:hover { background: #efefef; }
.history-item.active { background: #ececec; color: var(--text-primary); }
.history-item-title {
  flex: 1 1 auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.history-item-delete {
  border: none; background: none; color: var(--text-muted);
  font-size: 12px; opacity: 0; padding: 2px 4px; border-radius: 6px;
}
.history-item:hover .history-item-delete { opacity: 1; }
.history-item-delete:hover { color: #e5484d; background: rgba(229,72,77,.1); }

.sidebar-footer {
  padding: 14px 16px;
  font-size: 11px;
  color: var(--text-muted);
  border-top: 1px solid var(--border-color);
  line-height: 1.5;
}

/* ===================== 主内容区 ===================== */
.main-content {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  position: relative;
}

/* 顶部栏（含移动端菜单按钮） */
.topbar {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-color);
}
.menu-btn {
  border: none; background: none; padding: 4px; border-radius: 8px; color: var(--text-primary);
}
.menu-btn:hover { background: var(--bg-soft); }

/* ===================== 欢迎页（空对话） ===================== */
.welcome {
  flex: 1 1 auto;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 7vh 20px 40px;
}
.welcome-logo {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 0 0 6px;
  color: var(--text-primary);
}
.welcome-logo .ai { font-size: 30px; color: var(--text-muted); font-weight: 600; }
.welcome-sub {
  color: var(--text-secondary);
  font-size: 15px;
  margin: 0 0 30px;
  text-align: center;
}

/* 居中输入卡 */
.welcome-input-wrap {
  width: 100%;
  max-width: 720px;
}

/* ===================== Kimi 风格输入卡 ===================== */
.input-card {
  width: 100%;
  background: #ffffff;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 14px 16px 10px;
  transition: border-color .15s, box-shadow .15s;
}
.input-card:focus-within {
  border-color: #d0d0d0;
  box-shadow: 0 2px 6px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.07);
}
.input-textarea {
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.6;
  color: var(--text-primary);
  max-height: 200px;
}
.input-textarea::placeholder { color: var(--text-muted); }

.input-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  padding-top: 8px;
}
.input-footer .spacer { flex: 1 1 auto; }

.input-action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border-color);
  background: #fff;
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  transition: all .15s;
}
.input-action-btn:hover { background: var(--bg-soft); color: var(--text-primary); }
.input-action-btn.online { color: var(--accent-online); border-color: rgba(22,163,74,.35); background: rgba(22,163,74,.08); }
.input-action-btn .caret { font-size: 10px; opacity: .6; }
.input-action-btn .plus { font-size: 16px; line-height: 1; }

.send-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--text-primary);
  color: #fff;
  font-size: 16px;
  transition: opacity .15s, transform .1s;
}
.send-btn:hover { transform: translateY(-1px); }
.send-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

.input-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  margin: 10px 0 0;
}

/* 能力药丸 */
.pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 18px auto 0;
  max-width: 720px;
}
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--border-color);
  background: #fff;
  color: var(--text-secondary);
  font-size: 13.5px;
  transition: all .15s;
}
.pill:hover { background: var(--bg-soft); color: var(--text-primary); transform: translateY(-1px); }

/* ===================== 案例展示 ===================== */
.cases {
  width: 100%;
  max-width: 880px;
  margin: 44px auto 0;
}
.cases-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 700; color: var(--text-primary);
  margin: 0 0 16px;
}
.cases-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.case-card {
  display: block;
  text-decoration: none;
  color: inherit;
  border-radius: var(--radius-md);
  padding: 18px;
  min-height: 130px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border-color);
  background: #fff;
  transition: transform .18s ease, box-shadow .18s ease;
}
.case-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-pop);
}
.case-icon {
  font-size: 30px;
  margin-bottom: 12px;
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 52px; height: 52px;
  border-radius: 14px;
  background: var(--case-grad, #f0f0f0);
}
.case-title {
  font-weight: 700; font-size: 15px; color: var(--text-primary);
  margin-bottom: 4px;
}
.case-desc {
  font-size: 12.5px; color: var(--text-secondary); line-height: 1.5;
}
.case-link {
  position: absolute; right: 14px; bottom: 14px;
  font-size: 12px; color: var(--text-muted);
}

/* ===================== 对话态 ===================== */
.chat-view {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}
.chat-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 24px 16px 8px;
}
.chat-disclaimer {
  max-width: var(--content-max);
  margin: 0 auto 14px;
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  background: var(--bg-soft);
  border: 1px solid var(--border-color);
  border-radius: 999px;
  padding: 6px 14px;
}

.message-list {
  max-width: var(--content-max);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.message {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.message.user { flex-direction: row-reverse; }
.message-avatar {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  border-radius: 50%;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-soft);
}
.avatar-img { width: 100%; height: 100%; object-fit: cover; }
.avatar-emoji { font-size: 20px; }

.message-content { max-width: 78%; }
.message.user .message-content { display: flex; flex-direction: column; align-items: flex-end; }

.message-text {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: 15px;
  line-height: 1.7;
  word-break: break-word;
}
.message.assistant .message-text {
  background: var(--bg-soft);
  color: var(--text-primary);
  border-bottom-left-radius: var(--radius-sm);
}
.message.user .message-text {
  background: var(--text-primary);
  color: #fff;
  border-bottom-right-radius: var(--radius-sm);
}
.message-text p { margin: 0 0 10px; }
.message-text p:last-child { margin-bottom: 0; }
.message-text pre {
  background: #1e1e1e; color: #e6e6e6;
  padding: 12px 14px; border-radius: 10px;
  overflow-x: auto; font-size: 13px;
}
.message.user .message-text pre { background: #333; }
.message-text code {
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
  background: rgba(0,0,0,.06);
  padding: 1px 5px; border-radius: 5px;
}
.message.user .message-text code { background: rgba(255,255,255,.18); }

.search-badge {
  display: inline-block;
  font-size: 12px; color: var(--accent-online);
  background: rgba(22,163,74,.08);
  border: 1px solid rgba(22,163,74,.25);
  border-radius: 999px;
  padding: 2px 10px;
  margin-bottom: 8px;
}
.search-sources {
  margin-top: 8px;
  display: flex; flex-wrap: wrap; gap: 8px;
}
.search-source-link {
  font-size: 12px; color: var(--text-secondary);
  text-decoration: none;
  border: 1px solid var(--border-color);
  border-radius: 999px;
  padding: 3px 10px;
}
.search-source-link:hover { background: var(--bg-soft); }

.typing-indicator { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing-indicator span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-muted);
  animation: blink 1.2s infinite ease-in-out;
}
.typing-indicator span:nth-child(2) { animation-delay: .2s; }
.typing-indicator span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

/* 微信表情贴纸 */
.wx-sticker {
  display: inline-block;
  background: rgba(0,0,0,.04);
  border-radius: 6px;
  padding: 0 4px;
  font-size: 13px;
}

/* 对话态底部输入 */
.chat-input-dock {
  flex: 0 0 auto;
  padding: 10px 16px 18px;
  border-top: 1px solid var(--border-color);
  background: var(--bg-primary);
}
.chat-input-inner {
  max-width: var(--content-max);
  margin: 0 auto;
}
.doc-attachment {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--text-secondary);
  background: var(--bg-soft);
  border: 1px solid var(--border-color);
  border-radius: 999px;
  padding: 4px 12px;
  margin-bottom: 8px;
}

/* ===================== 移动端 ===================== */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,.12);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }

  .topbar { display: flex; }
  .welcome { padding: 4vh 14px 30px; }
  .welcome-logo { font-size: 34px; }
  .welcome-logo .ai { font-size: 22px; }

  .cases { margin-top: 30px; }
  .cases-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .case-card { padding: 14px; min-height: 110px; }
  .case-icon { width: 42px; height: 42px; font-size: 24px; border-radius: 12px; }

  .message-content { max-width: 84%; }
  .chat-input-dock { padding: 8px 10px 14px; }
}

  </style>

  <script>
/**
 * BOBO聊天机器人 — 本地存储
 */

const Storage = {
  getConversations() {
    try {
      const data = localStorage.getItem('st_conversations');
      const convs = data ? JSON.parse(data) : [];
      for (const c of convs) {
        for (const m of c.messages || []) {
          if (m.role === 'ai') m.role = 'assistant';
        }
      }
      return convs;
    } catch {
      return [];
    }
  },
  saveConversations(convs) {
    localStorage.setItem('st_conversations', JSON.stringify(convs));
  },
  getActiveId() {
    return localStorage.getItem('st_active_id') || null;
  },
  setActiveId(id) {
    localStorage.setItem('st_active_id', id);
  },
  createConversation(title = '新对话') {
    const convs = this.getConversations();
    const conv = {
      id: 'c_' + Date.now(),
      title,
      messages: [],
      documentContext: '',
      documentName: '',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    convs.unshift(conv);
    this.saveConversations(convs);
    this.setActiveId(conv.id);
    return conv;
  },
  getConversation(id) {
    return this.getConversations().find(c => c.id === id) || null;
  },
  addMessage(convId, message) {
    const convs = this.getConversations();
    const conv = convs.find(c => c.id === convId);
    if (!conv) return;
    if (message.role === 'ai') message.role = 'assistant';
    conv.messages.push(message);
    conv.updatedAt = new Date().toISOString();
    // 自动更新标题
    if (conv.messages.length === 1 && message.role === 'user') {
      conv.title = message.content.slice(0, 30);
    }
    this.saveConversations(convs);
  },
  updateConversation(id, updates) {
    const convs = this.getConversations();
    const conv = convs.find(c => c.id === id);
    if (!conv) return;
    Object.assign(conv, updates);
    conv.updatedAt = new Date().toISOString();
    this.saveConversations(convs);
  },
  deleteConversation(id) {
    let convs = this.getConversations();
    convs = convs.filter(c => c.id !== id);
    this.saveConversations(convs);
    if (this.getActiveId() === id) {
      this.setActiveId(convs[0]?.id || null);
    }
    return convs[0] || null;
  },
  // ====== 任务存储 ======
  getTasks() {
    try {
      return JSON.parse(localStorage.getItem('st_tasks') || '[]');
    } catch {
      return [];
    }
  },
  saveTask(task) {
    const tasks = this.getTasks().filter(t => t.id !== task.id);
    tasks.unshift({
      id: task.id,
      description: task.description,
      status: task.status,
      result: task.result,
      createdAt: task.createdAt,
      updatedAt: task.updatedAt
    });
    localStorage.setItem('st_tasks', JSON.stringify(tasks.slice(0, 50)));
  },
  getTask(id) {
    return this.getTasks().find(t => t.id === id) || null;
  },
  deleteTask(id) {
    const tasks = this.getTasks().filter(t => t.id !== id);
    localStorage.setItem('st_tasks', JSON.stringify(tasks));
  }
};

2. 自然地使用 emoji（😊🌟🐱🔥💡✨）和微信风格文字表情包，如 [微笑][捂脸][OK][玫瑰][强][爱心][耶] 等，像微信聊天一样亲切。
3. 除非内容需要结构化（列表/步骤/代码），否则用简短自然的段落，不要长篇大论。
4. 你不是万能的：不保证提供绝对准确或有价值的信息，遇到不确定的事就诚实说"这个本喵也不太确定喵~"。
